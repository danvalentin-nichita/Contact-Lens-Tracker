<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Base Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFDFD" />
      <stop offset="100%" stop-color="#E2EBF2" />
    </linearGradient>

    <!-- Left Cap Gradients -->
    <linearGradient id="leftCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F6FA" />
    </linearGradient>
    <linearGradient id="leftCapInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F7FB" />
      <stop offset="100%" stop-color="#DFE7EF" />
    </linearGradient>

    <!-- Right Cap Gradients -->
    <linearGradient id="rightCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CD964" />
      <stop offset="100%" stop-color="#2FA841" />
    </linearGradient>
    <linearGradient id="rightCapInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#44C759" />
      <stop offset="100%" stop-color="#2D9A3E" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowBase" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#002D52" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowCap" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002D52" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect x="132" y="312" width="760" height="400" rx="200" fill="url(#baseGrad)" filter="url(#shadowBase)" />

  <!-- Left Cap -->
  <circle cx="332" cy="512" r="175" fill="url(#leftCapGrad)" filter="url(#shadowCap)" />
  <circle cx="332" cy="512" r="145" fill="url(#leftCapInnerGrad)" />
  
  <!-- Right Cap -->
  <circle cx="692" cy="512" r="175" fill="url(#rightCapGrad)" filter="url(#shadowCap)" />
  <circle cx="692" cy="512" r="145" fill="url(#rightCapInnerGrad)" />

  <!-- Basic Clock Icon on Right Cap -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main circle -->
    <circle cx="692" cy="512" r="120" stroke-width="20" />
    <!-- Hands -->
    <path d="M692 416 L692 512 L752 560" stroke-width="20" />
  </g>
</svg>
